services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ai_outreach_pro
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_outreach_pro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
