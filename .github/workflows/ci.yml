name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aop_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt pip-audit
      - run: cd backend && pytest -q                       # SQLite
      - run: cd backend && pytest -q                       # PostgreSQL
        env: { TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/aop_test" }
      - run: cd backend && pip-audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm run build && npm audit --omit=dev
